name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Unit tests
        run: make test
        env:
          LD_SKIP_FLAKY_TESTS: true

      - name: Lint and type checks
        run: make lint
